[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litscraper"
version = "0.1.0"
description = "Structured extraction of material synthesis/property data from scientific PDFs into CSV."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
