[workspace]
name = "AerleumLitScraperV2"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-aarch64", "linux-64"]

[tasks]
test = "pytest -sv tests/"
grobid-up = "docker compose -f docker-compose.yml up -d"
grobid-down = "docker compose -f docker-compose.yml down"
extract = "python -m litscraper.pipeline.run"

[dependencies]
python = ">=3.11"
pip = "*"
pandas = ">=2.3.0,<3"
pydantic = ">=2.13.4,<3"
lxml = ">=5.3.0"
requests = ">=2.32.0"
tenacity = ">=9.0.0"
pytest = ">=8.0.0"

[pypi-dependencies]
openai = ">=1.50.0"
instructor = ">=1.7.0"
python-dotenv = "*"
tqdm = "*"

[pypi-dependencies.litscraper]
path = "."
editable = true
